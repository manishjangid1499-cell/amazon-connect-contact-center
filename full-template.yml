AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: |
  Serverless backend to support additional Amazon Connect contact center functionality

Globals:
  Function:
    Timeout: 10
    Runtime: python3.12
    Handler: index.lambda_handler

Parameters:
  UserPhoneNumber:
    Type: String
    Description: |
      Your phone number to act as the emergency contact in +1XXXXXXXXXX format

Resources:

  ContactLookupLambda:
    Type: 'AWS::Serverless::Function'
    Properties:
      InlineCode: |
        import boto3
        import os
        import time

        ddb = boto3.resource('dynamodb')

        def lambda_handler(event, context):
            print("Received event:", event)

            tb_name = os.environ['ContactHistoryTable']
            table = ddb.Table(tb_name)
            details = event.get("Details", {})
            params = details.get("Parameters", {})
            contact_id = params.get("CustomerNumber") or details.get("ContactData", {}).get("CustomerEndpoint", {}).get("Address", "Unknown")
            now = int(time.time())

            resp = table.update_item(
                Key={"ContactId": contact_id},
                UpdateExpression="SET LastCall = :n",
                ExpressionAttributeValues={
                    ':n': now
                },
                ReturnValues="ALL_OLD"
            )

            # If attributes existed prior to the update, this is a returning caller
            if resp.get('Attributes'):
                return {"ContactStatus": "return_caller"}
            else:
                return {"ContactStatus": "new_caller"}
      Policies:
        - DynamoDBCrudPolicy: 
            TableName: !Ref ContactHistoryTable
      Environment:
        Variables:
          ContactHistoryTable: !Ref ContactHistoryTable

  PutContactinQueueLambda:
    Type: 'AWS::Serverless::Function'
    Properties:
      InlineCode: |
        import boto3
        import json
        import os

        sqs = boto3.client('sqs')

        def lambda_handler(event, context):
            print("Received event:", event)
            queue_url = os.environ['SQSQueue']
            details = event.get('Details', {})
            parameters = details.get('Parameters', {})
            contact_data = details.get('ContactData', {})

            instance_arn = contact_data.get('InstanceARN', '')
            connect_instance_id = instance_arn.split('/')[-1] if '/' in instance_arn else instance_arn[-36:]
            source_phone_number = contact_data.get('SystemEndpoint', {}).get('Address', '')

            body = {
                "contact_id": parameters.get('CustomerNumber', ''),
                "connect_instance_id": connect_instance_id,
                "outbound_contact_flow_id": parameters.get('OutboundContactFlowId', ''),
                "source_phone_number": source_phone_number
            }

            resp = sqs.send_message(
                QueueUrl=queue_url,
                MessageBody=json.dumps(body),
                DelaySeconds=30
            )

            print("SQS response:", resp)
            return {'SendMessage': 'success'}
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt OutboundDialQueue.QueueName
      Environment:
        Variables:
          SQSQueue: !Ref OutboundDialQueue

  ContactRouterLambda:
    Type: 'AWS::Serverless::Function'
    Properties:
      InlineCode: |
        import os
        import datetime

        def lambda_handler(event, context):
            print("Received event:", event)

            number = os.environ.get("UserPhoneNumber", "")
            escalation_number = number

            on_call_schedule = {
                0: {'TargetContact': number, 'EscalationContact': escalation_number},
                1: {'TargetContact': number, 'EscalationContact': escalation_number},
                2: {'TargetContact': number, 'EscalationContact': escalation_number},
                3: {'TargetContact': number, 'EscalationContact': escalation_number},
                4: {'TargetContact': number, 'EscalationContact': escalation_number},
                5: {'TargetContact': number, 'EscalationContact': escalation_number},
                6: {'TargetContact': number, 'EscalationContact': escalation_number},
            }

            day_of_week = datetime.datetime.today().weekday()
            return on_call_schedule.get(day_of_week, {'TargetContact': number, 'EscalationContact': escalation_number})
      Environment:
        Variables:
          UserPhoneNumber: !Ref UserPhoneNumber

  GetHotMessageLambda:
    Type: 'AWS::Serverless::Function'
    Properties:
      InlineCode: |
        import boto3
        import os
        import time
        from boto3.dynamodb.conditions import Attr

        dynamodb = boto3.resource('dynamodb')
        table = dynamodb.Table(os.environ['HotMessageTable'])

        def lambda_handler(event, context):
            print("Received event:", event)

            now = int(time.time())

            resp = table.scan(
                FilterExpression=Attr('EndTimeStamp').gte(now) & Attr('StartTimeStamp').lte(now)
            )

            items = resp.get('Items', [])
            if items:
                return {
                    'ActiveMessage': 'True',
                    'Message': items[0].get('Message', 'NA')
                }

            return {
                'ActiveMessage': 'False',
                'Message': 'NA'
            }
      Environment:
        Variables:
          HotMessageTable: !Ref HotMessageTable
      Policies:
        - DynamoDBCrudPolicy: 
            TableName: !Ref HotMessageTable

  InitiateOutboundDialLambda:
    Type: 'AWS::Serverless::Function'
    Properties:
      InlineCode: |
        import json
        import boto3
        import os
        import logging

        logger = logging.getLogger()
        logger.setLevel(logging.INFO)
        connect = boto3.client('connect')

        def lambda_handler(event, context):
            logger.info("Received event: %s", json.dumps(event))
            records = event.get('Records', [])

            for record in records:
                try:
                    outbound_dial = json.loads(record["body"])
                    resp = connect.start_outbound_voice_contact(
                        ContactFlowId=outbound_dial["outbound_contact_flow_id"],
                        InstanceId=outbound_dial["connect_instance_id"],
                        SourcePhoneNumber=outbound_dial["source_phone_number"],
                        DestinationPhoneNumber=outbound_dial["contact_id"]
                    )
                    logger.info("Initiated call: %s", resp)
                except Exception as e:
                    logger.error("Failed to initiate outbound call for record %s: %s", record.get("messageId"), str(e))
                    raise e
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt OutboundDialQueue.QueueName
        - Statement:
            - Sid: OutboundCallerPolicy
              Effect: Allow
              Action:
                - 'connect:StartOutboundVoiceContact'
              Resource: '*'
      Events:
        MySQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt OutboundDialQueue.Arn
            BatchSize: 10

  OutboundDialQueue:
    Type: 'AWS::SQS::Queue'
    Properties:
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OutboundDialDLQ.Arn
        maxReceiveCount: 3

  OutboundDialDLQ:
    Type: 'AWS::SQS::Queue'

  ContactHistoryTable:
    Type: 'AWS::Serverless::SimpleTable'
    Properties:
      PrimaryKey:
        Name: ContactId
        Type: String

  HotMessageTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      BillingMode: PAY_PER_REQUEST 
      AttributeDefinitions:
        - AttributeName: EndTimeStamp
          AttributeType: N
        - AttributeName: StartTimeStamp
          AttributeType: N
      KeySchema:
        - AttributeName: EndTimeStamp
          KeyType: HASH
        - AttributeName: StartTimeStamp
          KeyType: RANGE
